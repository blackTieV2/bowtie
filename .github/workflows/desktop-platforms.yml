name: Desktop platform build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run build
      - name: Rust acceptance tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build offline desktop app
        run: npm run tauri build -- --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: barrier-atlas-${{ matrix.os }}
          path: |
            app/src-tauri/target/release/barrier-atlas.exe
            app/src-tauri/target/release/barrier-atlas
          if-no-files-found: error
          retention-days: 30
